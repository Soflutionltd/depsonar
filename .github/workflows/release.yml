# Ships a new version as soon as the version in package.json changes on main:
#   1. builds, tests and publishes the package to npm, unless that version is already there;
#   2. creates the vX.Y.Z tag and GitHub release;
#   3. starts the MCP Registry workflow (when the repository has one), which builds the .mcpb bundle.
# Everyone installed with `npx -y <package>@latest` or with the .mcpb extension then updates on their own.
#
# npm publishing uses Trusted Publishing (OIDC): no npm token is stored anywhere, and npm adds the
# provenance attestation by itself. One-time setup on npmjs.com, package depsonar > Settings >
# Trusted publishing > GitHub Actions: organization Soflutionltd, repository depsonar, workflow
# release.yml, no environment, and allow `npm publish`. The first publish must happen within 2 days
# of saving that configuration, or it expires. Without it, the publish step fails (ENEEDAUTH) and
# no tag is created; run this workflow by hand (Actions > Release > Run workflow) once it is set.
# Needs npm 11.5.1 or later and Node 22.14 or later.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read the version
        run: |
          echo "NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"
          echo "V=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Check npm supports Trusted Publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1'); process.exit(1) }" "$(npm --version)"

      - name: Build and test
        run: |
          npm ci
          npm test

      - name: Publish to npm (Trusted Publishing)
        run: |
          if npm view "$NAME@$V" version >/dev/null 2>&1; then
            echo "$NAME@$V is already on npm"
          else
            npm publish --access public
          fi

      - name: Tag and GitHub release
        run: |
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already exists"
            echo "NEW_TAG=false" >> "$GITHUB_ENV"
          else
            git tag "v$V"
            git push origin "v$V"
            gh release create "v$V" --title "$NAME v$V" --generate-notes
            echo "NEW_TAG=true" >> "$GITHUB_ENV"
          fi

      - name: Build the .mcpb bundle and publish to the MCP Registry
        if: env.NEW_TAG == 'true' && hashFiles('.github/workflows/mcp-registry.yml') != ''
        run: gh workflow run mcp-registry.yml -f tag="v$V"
